<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Open License Advisor</title>
  <desc id="bannerDesc">Developer hero banner for Open License Advisor showing policy-first SPDX evaluation, repository audits, and automated pull requests.</desc>

  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#D0D7DE" />
    </pattern>
    <clipPath id="bannerClip">
      <rect x="1" y="1" width="1198" height="298" rx="16" />
    </clipPath>
  </defs>

  <!-- Crisp white card background -->
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2" />

  <!-- Subtle architectural dot-grid accent on right -->
  <rect x="760" y="1" width="439" height="298" fill="url(#dotGrid)" opacity="0.65" clip-path="url(#bannerClip)" />

  <!-- Left Emblem: Scales of Justice + Document + Green PR Branch -->
  <g transform="translate(46, 62) scale(0.86)">
    <path
      d="M 44 28 H 106 L 136 58 V 156 A 8 8 0 0 1 128 164 H 44 A 8 8 0 0 1 36 156 V 36 A 8 8 0 0 1 44 28 Z"
      fill="#FFFFFF"
      stroke="#24292F"
      stroke-width="10"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path d="M 106 28 V 58 H 136" fill="none" stroke="#24292F" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
    <line x1="86" y1="68" x2="86" y2="128" stroke="#24292F" stroke-width="6" stroke-linecap="round" />
    <line x1="66" y1="128" x2="106" y2="128" stroke="#24292F" stroke-width="6" stroke-linecap="round" />
    <line x1="56" y1="84" x2="116" y2="84" stroke="#24292F" stroke-width="6" stroke-linecap="round" />
    <circle cx="86" cy="84" r="5" fill="#24292F" />
    <line x1="60" y1="84" x2="50" y2="106" stroke="#24292F" stroke-width="3.5" stroke-linecap="round" />
    <line x1="60" y1="84" x2="70" y2="106" stroke="#24292F" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 48 106 H 72 A 12 8 0 0 1 48 106 Z" fill="#24292F" />
    <line x1="112" y1="84" x2="102" y2="106" stroke="#24292F" stroke-width="3.5" stroke-linecap="round" />
    <line x1="112" y1="84" x2="122" y2="106" stroke="#24292F" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 100 106 H 124 A 12 8 0 0 1 100 106 Z" fill="#24292F" />
    <rect x="108" y="106" width="78" height="76" rx="16" fill="#FFFFFF" />
    <line x1="122" y1="120" x2="122" y2="164" stroke="#2DA44E" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 122 152 C 122 140, 140 140, 140 128" fill="none" stroke="#2DA44E" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="122" cy="120" r="5" fill="#FFFFFF" stroke="#2DA44E" stroke-width="4" />
    <circle cx="122" cy="164" r="5" fill="#FFFFFF" stroke="#2DA44E" stroke-width="4" />
    <circle cx="140" cy="124" r="5" fill="#FFFFFF" stroke="#2DA44E" stroke-width="4" />
    <circle cx="160" cy="156" r="22" fill="#2DA44E" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 150 156 L 157 163 L 171 148" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Center-left Title, Subtitle & Flat Pill Tags -->
  <text
    x="228"
    y="112"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#24292F"
  >Open License Advisor</text>

  <text
    x="228"
    y="152"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
    font-size="20"
    font-weight="400"
    fill="#57606A"
  >Policy-First SPDX License Evaluation, Repository Audits &amp; Automated PRs</text>

  <!-- Bottom Pill Tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="228" y="192" width="188" height="32" rx="16" fill="#2DA44E" />
    <text x="322" y="213" text-anchor="middle" fill="#FFFFFF">GitHub Marketplace App</text>

    <rect x="428" y="192" width="204" height="32" rx="16" fill="#0969DA" />
    <text x="530" y="213" text-anchor="middle" fill="#FFFFFF">12 Verified SPDX Licenses</text>

    <rect x="644" y="192" width="216" height="32" rx="16" fill="#24292F" />
    <text x="752" y="213" text-anchor="middle" fill="#FFFFFF">Zero-Database Stateless API</text>
  </g>

  <!-- Right Side: Minimalist 3-Node Workflow Illustration -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <!-- Node 1: Policy Audit -->
    <rect x="920" y="42" width="234" height="48" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2" />
    <circle cx="944" cy="66" r="7" fill="#24292F" />
    <text x="962" y="71" fill="#24292F">Policy Audit</text>

    <!-- Connector 1 -> 2 -->
    <line x1="1037" y1="90" x2="1037" y2="118" stroke="#2DA44E" stroke-width="3" />
    <polygon points="1031,114 1043,114 1037,124" fill="#2DA44E" />

    <!-- Node 2: SPDX Match -->
    <rect x="920" y="126" width="234" height="48" rx="8" fill="#FFFFFF" stroke="#0969DA" stroke-width="2" />
    <circle cx="944" cy="150" r="7" fill="#0969DA" />
    <text x="962" y="155" fill="#24292F">SPDX Match</text>

    <!-- Connector 2 -> 3 -->
    <line x1="1037" y1="174" x2="1037" y2="202" stroke="#2DA44E" stroke-width="3" />
    <polygon points="1031,198 1043,198 1037,208" fill="#2DA44E" />

    <!-- Node 3: chore/add-license PR -->
    <rect x="920" y="210" width="234" height="48" rx="8" fill="#FFFFFF" stroke="#2DA44E" stroke-width="2" />
    <circle cx="944" cy="234" r="9" fill="#2DA44E" />
    <path d="M 940 234 L 943 237 L 949 231" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="962" y="239" fill="#24292F">chore/add-license PR</text>
  </g>
</svg>

