<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">GitHub License Advisor Logo</title>
  <desc id="logoDesc">Minimalist document and balance scale icon on a crisp white square background.</desc>
  <rect width="200" height="200" rx="24" fill="#FFFFFF" />
  <rect x="6" y="6" width="188" height="188" rx="20" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="4" />
  <!-- Document frame -->
  <path d="M56 36h60l28 28v96a8 8 0 0 1-8 8H56a8 8 0 0 1-8-8V44a8 8 0 0 1 8-8z" fill="#F6F8FA" stroke="#24292F" stroke-width="6" stroke-linejoin="round" />
  <path d="M116 36v28h28" fill="none" stroke="#24292F" stroke-width="6" stroke-linejoin="round" />
  <!-- Balance / Policy Beam -->
  <line x1="96" y1="74" x2="96" y2="128" stroke="#0969DA" stroke-width="6" stroke-linecap="round" />
  <line x1="70" y1="88" x2="122" y2="88" stroke="#0969DA" stroke-width="6" stroke-linecap="round" />
  <circle cx="96" cy="88" r="5" fill="#0969DA" />
  <path d="M64 108h16l-8-18z" fill="#1F883D" />
  <path d="M112 108h16l-8-18z" fill="#1F883D" />
  <line x1="80" y1="128" x2="112" y2="128" stroke="#24292F" stroke-width="6" stroke-linecap="round" />
  <!-- Approved Check Bar -->
  <rect x="68" y="142" width="56" height="8" rx="4" fill="#1F883D" />
</svg>

