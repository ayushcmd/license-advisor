name: Keep Render Server Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        run: curl -fsS --max-time 60 "https://license-advisor.onrender.com/api/health"
